name: Compiler Feuillet pour Windows

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Décompresser les zip déposés
        id: sources
        shell: pwsh
        run: |
          $zips = Get-ChildItem -Path . -Filter *.zip -File | ForEach-Object {
            $t = git log -1 --format=%ct -- $_.Name
            [pscustomobject]@{ Fichier = $_.FullName; Date = [long]("0" + $t) }
          } | Sort-Object Date
          foreach ($z in $zips) {
            Write-Host "Décompression de $($z.Fichier)"
            Expand-Archive -Path $z.Fichier -DestinationPath . -Force
          }
          if (Test-Path CMakeLists.txt) {
            "pret=true" >> $env:GITHUB_OUTPUT
          } else {
            "pret=false" >> $env:GITHUB_OUTPUT
            Write-Host "::notice::Deposez le zip"
          }

      - name: Installer Qt 6
        if: steps.sources.outputs.pret == 'true'
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'
          modules: 'qtpdf qtimageformats'
          cache: true

      - name: Installer LibRaw (photos RAW)
        if: steps.sources.outputs.pret == 'true'
        continue-on-error: true
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install libraw:x64-windows-static-md

      - name: Compiler
        if: steps.sources.outputs.pret == 'true'
        shell: pwsh
        run: |
          $qt = $env:QT_ROOT_DIR
          if (-not $qt) { $qt = $env:Qt6_DIR }
          $tc = "$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake"
          cmake -S . -B build -A x64 "-DCMAKE_PREFIX_PATH=$qt" "-DCMAKE_TOOLCHAIN_FILE=$tc" -DVCPKG_TARGET_TRIPLET=x64-windows-static-md -DVCPKG_MANIFEST_MODE=OFF
          if ($LASTEXITCODE -eq 0) { cmake --build build --config Release --parallel }
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::warning::Sans LibRaw"
            Remove-Item -Recurse -Force build -ErrorAction SilentlyContinue
            cmake -S . -B build -A x64 "-DCMAKE_PREFIX_PATH=$qt" -DFEUILLET_AVEC_LIBRAW=OFF
            if ($LASTEXITCODE -ne 0) { exit 1 }
            cmake --build build --config Release --parallel
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }

      - name: Rassembler le programme
        if: steps.sources.outputs.pret == 'true'
        shell: pwsh
        run: |
          $qt = $env:QT_ROOT_DIR
          if (-not $qt) { $qt = $env:Qt6_DIR }
          New-Item -ItemType Directory -Force Feuillet | Out-Null
          Copy-Item build\Release\Feuillet.exe Feuillet\
          & "$qt\bin\windeployqt.exe" --release --no-translations --no-system-d3d-compiler --no-opengl-sw --no-compiler-runtime Feuillet\Feuillet.exe
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
